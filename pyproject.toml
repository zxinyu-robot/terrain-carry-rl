[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "terrain-carry-rl"
version = "0.1.0"
description = "Whole-body transfer, distillation, and Sim2Real research scaffold for Go2 + Piper"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "numpy>=1.26,<2",
  "torch>=2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
terrain-carry-rl = "terrain_carry_rl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/terrain_carry_rl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
